task: commonsense_qa
dataset_path: tau/commonsense_qa
output_type: generate_until
training_split: train
validation_split: validation
doc_to_text: "What is the correct answer to this question: {{ question.strip() }}\nChoices:\n(A) {{choices['text'][0]}}\n(B) {{choices['text'][1]}}\n(C) {{choices['text'][2]}}\n(D) {{choices['text'][3]}}\n(E) {{choices['text'][4]}}\nPlease think step by step and answer the question with \"The answer is (X).\" where X is a single letter."
doc_to_target: "({{answerKey}})"
generation_kwargs:
  max_gen_toks: 1024
  do_sample: true
  temperature: 0.1
  until: []
repeats: 4
num_fewshot: 0
filter_list:
  - name: "flexible-extract"
    filter:
      - function: "multi_choice_regex"
        group_select: -1
        ignore_case: true
        ignore_punctuation: true
        regex_pattern: "(\\([A-Z]\\))"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
